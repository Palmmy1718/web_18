{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{% static 'home/admin.css' %}">
</head>
<body>
<div class="admin-container">
    <h2>{{ title }}</h2>
    <form method="post" enctype="multipart/form-data" class="admin-form">
        {% csrf_token %}
        <input type="text" name="name" placeholder="ชื่อเมนู" value="{{ recipe.name|default:'' }}" required>

        <select name="category" required>
            <option value="" disabled selected>-- เลือกประเภท --</option>
            {% for cat in categories %}
                <option value="{{ cat.id }}" {% if recipe.category.id == cat.id %}selected{% endif %}>
                    {{ cat.name }}
                </option>
            {% endfor %}
        </select>

        <input type="file" name="image" accept="image/*">
        <textarea name="ingredients" placeholder="วัตถุดิบ" required rows="5">{{ recipe.ingredients|default:'' }}</textarea>
        <textarea name="instructions" placeholder="วิธีทำ" required rows="10">{{ recipe.instructions|default:'' }}</textarea>

        <div class="admin-form-actions">
            <button type="submit" class="admin-btn save">บันทึก</button>
            <a href="{% url 'admin_recipes' %}" class="admin-btn cancel">ยกเลิก</a>
        </div>
    </form>
</div>
</body>
</html>
